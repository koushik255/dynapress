[project]
name = "neural-compression"
version = "0.1.0"
description = "Experimental lossy text compression: store word prefixes, reconstruct with a small pretrained LM."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "zstandard>=0.23",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]
training = ["peft>=0.18,<0.20", "accelerate>=1.10,<2"]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs the pretrained model download (deselect with -m 'not slow')"]
